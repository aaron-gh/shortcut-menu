name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # A tag such as v0.1 builds a release APK, signed with the release key, and publishes it.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Build signed release
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: shortcutmenu
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "The release key secret is missing." >&2
            exit 1
          fi
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          export SIGNING_STORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew assembleRelease --console=plain
          cp app/build/outputs/apk/release/app-release.apk shortcut-menu.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The notes are the annotated tag's message.
          gh release create "$GITHUB_REF_NAME" shortcut-menu.apk \
            --title "Shortcut Menu ${GITHUB_REF_NAME#v}" --notes-from-tag
